; The Python half of the suite. scripts/run-tests.sh is what runs it, and a
; pre-commit hook is what runs that. Calling pytest by hand is debugging.
;
; Three axes classify every test in this tree, and pytest carries all three as
; markers. `kind` is applied by tests/conftest.py from the directory a test
; sits in, so no test repeats its own path. `cost` and `venue` are written on
; the test.
;
; --strict-markers turns a typo in a marker name into an error instead of a
; test that silently never runs.

[pytest]
testpaths = tests
addopts = --strict-markers --strict-config -ra
markers =
    unit: one function, no filesystem beyond tmp_path
    integration: several modules together, real files under tmp_path
    e2e: the command line a person types; normally bats, not pytest
    meta: an invariant of this source tree rather than of the payload
    fast: runs at pre-commit; keep it under a second
    slow: runs at pre-push
    local: needs this machine, the real pi binary, or the network
    ci: runs anywhere the devShell runs
