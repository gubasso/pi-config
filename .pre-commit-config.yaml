# Gates for the pi-config source tree.
#
# Per-stage budget:
#   pre-commit : fast, local, deterministic.
#   pre-push   : slower and network-aware (link check, full-history secrets,
#                slow tests). It does not repeat a pre-commit check, so a
#                hook whose upstream manifest names pre-push sets its stages.
#   commit-msg : the Conventional Commits grammar and the message layout.
#
# This tree has no `rk integrate` gate, so it drops the pre-merge-commit type
# and stage of the reference sets of exobrain-tech, as the common set says.
#
# What each tool owns:
#   prek built-ins      : whitespace, line endings, symlinks, shebangs, basic
#                         safety, and the YAML, TOML, and JSON syntax.
#   editorconfig-checker: honor .editorconfig.
#   dprint              : the formatter of record for markdown and JSON.
#                         dprint.json lists the runtime-owned files it must
#                         not touch.
#   markdownlint-cli2   : style gate beyond dprint, plus the one autofix
#                         dprint cannot do (MD029 renumbering).
#   ruff                : the Python under scripts/ and tests/.
#   shellcheck, shfmt   : the shell under scripts/ and tests/helpers/.
#                         Not *.bats: `@test "x" {` is not bash.
#   run-tests.sh        : the suite. The cost tag on a test picks the
#                         stage, so `fast` lands here and `slow` at push.
#   nixfmt/statix/deadnix: flake.nix.
#   typos, ripsecrets   : spelling and staged-diff secrets.
#   gitleaks            : full-history secret scan, at push time.
#   lychee              : link check, at push time.
#   just check          : this repository's own contract — no tracked secret,
#                         gitignore coverage, every plugin sidecar classified.
#   md-toc              : the list between two `<!--TOC-->` markers.
#   committed           : the grammar, subject and body length, punctuation,
#                         case.
#
# Who owns each tool: the most specific file that declares it natively (the
# dev environment rule of nix-secrets,
# home/apps/claude-session/rules/dev-environment.md). This file owns each
# hook tool that prek can build an environment for, pinned by `rev`.
# pyproject.toml and uv.lock own the Python tools, package.json the
# TypeScript tools, and flake.nix the toolchains and each tool that no owner
# above can declare. A hook that keeps `language: system`, or an upstream
# `-system` id, names its owner, class, and reason in an `# owner:` comment
# directly above it.
#
# The hooks follow the reference sets common, python, bash, and nix of
# exobrain-tech. hook-revisions holds each shared `rev` to the exobrain-tech
# tag of this file. A field that differs from a set states its reason in a
# comment directly above the hook.
#
# Install every stage with `just hooks`.

# The host supplies the hook runner prek, and this is the oldest prek the
# configuration accepts
# (https://prek.j178.dev/reference/configuration/#minimum_prek_version).
minimum_prek_version: "0.5.7"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # --- prek built-in hooks ---
  #
  # prek runs these in its own binary: no clone, no environment, and no `rev`.
  # They take the place of the hooks of pre-commit/pre-commit-hooks and of the
  # check-json5 repositories. Where a built-in judges less than its upstream
  # hook by default, its arguments restore the upstream behavior
  # (https://prek.j178.dev/0.5.7/reference/built-in-hooks/).
  - repo: builtin
    hooks:
      # The three whitespace fixers skip the JSON Pi writes at runtime, for
      # the same reason dprint.json excludes it. Pi writes settings.json with
      # no trailing newline; a fixer that adds one is undone on Pi's next
      # write, and the pair trade the same byte forever. The exclude list is
      # the one in dprint.json.
      #
      # They also skip the lock files that nix, npm, and uv write. A generated file
      # follows its generator: the dev environment rule of nix-secrets,
      # home/apps/claude-session/rules/dev-environment.md. The negative `files`
      # pattern keeps them out
      # beside the shared runtime exclude, which a drift test pins to
      # dprint.json. typos and editorconfig-checker skip the lock files in
      # _typos.toml and .editorconfig-checker.json.
      #
      # project: `files: *not_a_lock_file` and `exclude: *runtime_owned` in
      # place of the lock exclude of the common set, because
      # tests/meta/test_drift.py pins one shared `^home/` exclude to
      # dprint.json (SPEC.md §14).
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # keep two-space hard breaks
        files: &not_a_lock_file '^(?!(flake\.lock|package-lock\.json|uv\.lock)$)'
        exclude: &runtime_owned '^home/\.pi/agent/(settings\.json|keybindings\.json|pi-plan-mode\.json|99extensions\.json|intercom/config\.json|extensions/.*/config\.json)$'
        stages: [pre-commit]
      - id: end-of-file-fixer
        files: *not_a_lock_file
        exclude: *runtime_owned
        stages: [pre-commit]
      # The default `auto` keeps the most frequent ending of a file, so a file
      # that holds only CRLF passes. `--fix=lf` holds every file to LF.
      - id: mixed-line-ending
        args: [--fix=lf]
        files: *not_a_lock_file
        exclude: *runtime_owned
      - id: check-added-large-files
        args: ['--maxkb=1024']
        stages: [pre-commit]
      - id: check-case-conflict
      # Without the argument the hook passes outside a merge or a rebase, so a
      # marker that a resolved conflict left behind lands unseen.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      # prek accepts an unknown tag unless it gets --disallow-unknown-tags. The
      # upstream hook refuses one while it loads the file.
      - id: check-yaml
        args: [--disallow-unknown-tags]
      - id: check-toml
      # project: no check-xml and no check-symlinks, because the tree tracks
      # no XML file and no symlink, and check-hooks-apply refuses a hook that
      # matches no file.
      # check-json5 parses JSON with comments and trailing commas, so it does
      # not refuse a commented .json configuration such as dprint.json or a
      # .jsonc file. The built-in selects only .json5 files through `types`,
      # and the upstream hook selected json and json5. `types` resets the
      # filter to every file, and `types_or` restores json and json5 and adds
      # jsonc. Unlike the upstream hook, the built-in refuses a duplicate key.
      # It is the syntax gate only. A formatter owns the layout, and the stock
      # check-json refuses comments.
      - id: check-json5
        types: [file]
        types_or: [json, json5, jsonc]
      - id: detect-private-key

  # --- EditorConfig ---
  #
  # The upstream `language: golang` hook, which prek builds at the pinned rev.
  # It checks what no formatter owns: the charset, the line endings, the
  # trailing whitespace, and the indent style.
  #   - -disable-insert-final-newline: end-of-file-fixer owns it.
  #   - -disable-indent-size: each formatter owns the indentation of its files
  #     (ruff, dprint, nixfmt, shfmt). The checker counts left padding
  #     without the syntax, so it refuses formatter output, such as a
  #     continued string aligned to its opening quote, or a docstring.
  # Markdown is excluded: the checker flags fenced code and the odd-width
  # continuation of an ordered list, and dprint owns Markdown. The project
  # excludes its generated files in .editorconfig-checker.json, the tool's own
  # configuration, so a direct run skips them too.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, -disable-indent-size]
        exclude: '\.md$'

  # --- Table of contents ---
  #
  # md-toc rewrites the list between two `<!--TOC-->` markers, and leaves a
  # file without the markers alone.
  #   - -p writes in place.
  #   - -c does not judge the coherence of the heading levels.
  #   - --skip-lines 1 leaves the H1 title out of the list.
  - repo: https://github.com/frnmst/md-toc
    rev: 9.1.0
    hooks:
      - id: md-toc
        args: [-p, -c, --skip-lines, '1', github]

  # --- Formatters and linters that resolve off PATH ---
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no hook in a language that the hook runner builds.
      - id: dprint
        name: dprint fmt
        entry: dprint fmt --allow-no-files
        language: system
        types_or: [markdown, json]
        files: '\.(md|json|jsonc)$'
        exclude: *runtime_owned

      # The flake publishes nixfmt as its `formatter`, and `nix fmt` and the
      # editors run it outside prek. The hook formats exactly like them, so it
      # runs the nixfmt of the same nixpkgs. The upstream hook is
      # `language: haskell`, builds from Hackage at its own rev, and needs ghc
      # and cabal on the PATH.
      # owner: devshell (outside-caller) `nix fmt` runs the nixfmt that the flake publishes as its formatter, so the hook runs the same one.
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]
      # statix walks the tree itself, so the hook passes no file names.
      # owner: devshell (no-hook-language) statix has no hook in a language that the hook runner builds.
      - id: statix
        name: statix check
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false

      # owner: devshell (no-hook-language) just publishes no hook in a language that the hook runner builds.
      - id: just-fmt
        name: just --fmt --check
        entry: just --unstable --fmt --check
        language: system
        files: '^justfile$'
        pass_filenames: false

      # owner: devshell (no-hook-language) it runs a recipe of this repository.
      - id: pi-config-check
        name: pi-config source proofs
        entry: just check
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # --- Types ---
      #
      # Both read a config file this repository now carries, and a config
      # nothing reads is drift waiting to happen. Neither passes filenames:
      # a type error is a property of the program, not of one file, and
      # checking a subset reports errors that a whole-project run does not.
      # owner: pyproject.toml (outside-caller) the language server of the editor runs pyright-langserver from the same dev group, so the hook runs that pyright through uv.
      - id: pyright
        name: pyright
        entry: uv run --no-sync pyright
        language: system
        files: '\.py$'
        pass_filenames: false
      # owner: package.json (project-environment) tsc checks the extensions against the node_modules and the Pi types of this tree, through npm run.
      - id: tsc
        name: tsc --noEmit
        entry: npm run --silent typecheck
        language: system
        files: '\.ts$'
        pass_filenames: false

      # --- Tests ---
      #
      # This pair is the source of truth for when the suite runs. The cost
      # tag on a test decides which one picks it up, and the budget in the
      # header decides what each stage may cost. `just test` calls these,
      # never the other way round.
      #
      # project: no pytest hook from the python set, because
      # scripts/run-tests.sh fast and slow already run pytest, bats, and
      # vitest at the two stages, and a pytest hook runs the suite twice.
      # owner: devshell (no-hook-language) a script of this repository.
      - id: pi-config-test-fast
        name: tests (fast)
        entry: scripts/run-tests.sh fast
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # owner: devshell (no-hook-language) a script of this repository.
      - id: pi-config-test-slow
        name: tests (slow)
        entry: scripts/run-tests.sh slow
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  # --- Shell ---
  #
  # scripts/ and tests/helpers/ are the only shell this tree authors. shfmt
  # takes its indent from .editorconfig, and -d reports instead of rewriting,
  # so the file a later hook reads is the file that was staged. The args
  # replace the --write of the upstream hook, and the manifest names more
  # stages than this tree runs it at.
  #
  # Neither tool sees *.bats. A bats file opens its tests with
  # `@test "name" {`, which is not bash and does not parse. bats itself is the
  # gate for those, through scripts/run-tests.sh.
  #
  # The stub `pi` carries no extension, because it stands in for a command on
  # PATH, so it is matched by path.
  #
  # project: both hooks keep `files:`, and shfmt keeps `-d` in place of the
  # `--write` of the bash set, for the reasons above.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        types: [file]
        files: '(\.(sh|bash)$|^tests/helpers/stubs/)'
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-d]
        types: [file]
        stages: [pre-commit]
        files: '(\.(sh|bash)$|^tests/helpers/stubs/)'

  # --- Nix dead code ---
  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      - id: deadnix

  # --- Markdown style gate ---
  #
  # Runs after dprint. The node comes from the devShell through
  # `language_version: system`, so prek does not download one.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']

  # --- Explicit relative links ---
  #
  # A bare-filename relative link like [x](README.md) is ambiguous: the same
  # basename exists in many directories here, so neither a reader nor a tool
  # can tell which file is meant, and the link rots silently when a file
  # moves. Require ./name, ../dir/name, or a multi-segment dir/name.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'

  # --- No language library in a flake ---
  #
  # A Python package goes to pyproject.toml or a PEP 723 block, a Node package
  # to package.json.
  - repo: local
    hooks:
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'

  # --- Python ---
  #
  # The editor runs `ruff server` from the same dev group, so the hooks run
  # that ruff through uv. The file types are the ones of the upstream hooks.
  #
  # project: ruff-check, ruff-format, and pyright stay local
  # `uv run --no-sync` hooks of class outside-caller in place of the
  # ruff-pre-commit and pyright-python repositories of the python set,
  # because the editor runs `ruff server` and `pyright-langserver` from the
  # dev group of pyproject.toml, and a hook runs the same version.
  - repo: local
    hooks:
      # owner: pyproject.toml (outside-caller) the language server of the editor runs ruff server from the dev group, so the hook runs that ruff.
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      # owner: pyproject.toml (outside-caller) the language server of the editor runs ruff server from the dev group, so the hook runs that ruff.
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  # --- Spelling, report only ---
  #
  # The upstream `language: python` hook. Its wheel holds a prebuilt binary
  # that links the standard ELF loader, which the host supplies (nix-ld on a
  # NixOS host).
  #
  # The args replace the upstream [--write-changes, --force-exclude]. An
  # automatic fix once renamed a deliberate identifier and an error-kind
  # string of a machine-readable contract. Fix a real typo by hand, and
  # allowlist a false positive in _typos.toml. --force-exclude keeps the
  # excludes of _typos.toml for the files that prek passes. The manifest
  # declares pre-push too, so `stages:` is explicit.
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        args: [--force-exclude]
        stages: [pre-commit]

  # --- Secrets ---
  #
  # This tree sits one directory away from auth.json, so the secret gate is
  # layered. ripsecrets, the upstream `language: rust` hook, scans what each
  # commit adds. gitleaks scans the whole history before a push: the upstream
  # entry scans the staged index, which is empty at a push, so this entry scans
  # the history and passes no file names.
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose --no-banner
        pass_filenames: false
        stages: [pre-push]

  # --- Link check (network, push time only) ---
  #
  # Arguments stay minimal so lychee.toml owns the behavior. The cache file
  # .lycheecache is gitignored.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # owner: devshell (no-hook-language) lychee publishes no hook in a language that the hook runner builds.
      - id: lychee-system
        stages: [pre-push]
        types: [markdown]
        args: [--no-progress]

  # The hooks that exobrain-tech publishes. A flake reference reads the git
  # tree of a checkout, never a path copy of the whole folder into the Nix
  # store. A flake holds no git hook runner, because the host supplies prek.
  # host-requirements.toml parses each time it changes. hook-revisions holds
  # the `rev` of each repository of the named sets to the copy at this tag.
  # The hooks call the exobrain CLI of the host.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.2.0
    hooks:
      - id: no-path-flake-reference
      - id: no-hook-runner-in-flake
      - id: host-requirements
      - id: hook-revisions
        args: [--set, common, --set, python, --set, bash, --set, nix]

  # --- Commit message ---
  #
  # The upstream `language: python` hook, with its own args
  # (--fixup --wip --commit-file). committed.toml holds the rules: the
  # Conventional Commits grammar, the line length, the case, and the period
  # at the end of the subject. This tree has no release-kit block, so
  # committed alone judges the message.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.12
    hooks:
      - id: committed
        stages: [commit-msg]

  # --- Keep this file honest ---
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
