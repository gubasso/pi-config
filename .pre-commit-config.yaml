# Gates for the pi-config source tree.
#
# Per-stage budget:
#   pre-commit : fast, local, deterministic.
#   pre-push   : slower and network-aware (link check, full-history secrets,
#                slow tests). It does not repeat a pre-commit check, so a
#                hook whose upstream manifest names pre-push sets its stages.
#   commit-msg : message content, on top of the global grammar hook.
#
# What each tool owns:
#   pre-commit-hooks    : whitespace, line endings, basic safety.
#   check-json5         : JSON and JSONC syntax, comments included.
#   editorconfig-checker: honor .editorconfig.
#   dprint              : the formatter of record for markdown and JSON.
#                         dprint.json lists the runtime-owned files it must
#                         not touch.
#   markdownlint-cli2   : style gate beyond dprint, plus the one autofix
#                         dprint cannot do (MD029 renumbering).
#   ruff                : the Python under scripts/ and tests/.
#   shellcheck, shfmt   : the shell under scripts/ and tests/helpers/.
#                         Not *.bats: `@test "x" {` is not bash.
#   run-tests.sh        : the suite. The cost tag on a test picks the
#                         stage, so `fast` lands here and `slow` at push.
#   nixfmt/statix/deadnix: flake.nix.
#   typos, ripsecrets   : spelling and staged-diff secrets.
#   gitleaks            : full-history secret scan, at push time.
#   lychee              : link check, at push time.
#   just check          : this repository's own contract — no tracked secret,
#                         gitignore coverage, every plugin sidecar classified.
#   committed           : subject and body length, punctuation, case.
#
# Who owns each tool: the most specific file that declares it natively (the
# dev environment rule of nix-secrets,
# home/apps/claude-session/rules/dev-environment.md). pre-commit owns each
# hook tool that it can build an environment for, pinned by `rev`.
# pyproject.toml and uv.lock own the Python tools, package.json the
# TypeScript tools, and flake.nix the toolchains and each tool that no owner
# above can declare. A hook that keeps `language: system`, or an upstream
# `-system` id, names its owner, class, and reason in an `# owner:` comment
# directly above it.
#
# Install every stage with `just hooks`.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # --- Housekeeping ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The three whitespace fixers skip the JSON Pi writes at runtime, for
      # the same reason dprint.json excludes it. Pi writes settings.json with
      # no trailing newline; a fixer that adds one is undone on Pi's next
      # write, and the pair trade the same byte forever. The exclude list is
      # the one in dprint.json.
      #
      # They also skip the lock files that nix, npm, and uv write. A generated file
      # follows its generator: the dev environment rule of nix-secrets,
      # home/apps/claude-session/rules/dev-environment.md. The negative `files`
      # pattern keeps them out
      # beside the shared runtime exclude, which a drift test pins to
      # dprint.json. typos and editorconfig-checker skip the lock files in
      # _typos.toml and .editorconfig-checker.json.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # keep two-space hard breaks
        files: &not_a_lock_file '^(?!(flake\.lock|package-lock\.json|uv\.lock)$)'
        exclude: &runtime_owned '^home/\.pi/agent/(settings\.json|keybindings\.json|pi-plan-mode\.json|99extensions\.json|intercom/config\.json|extensions/.*/config\.json)$'
        stages: [pre-commit]
      - id: end-of-file-fixer
        files: *not_a_lock_file
        exclude: *runtime_owned
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        files: *not_a_lock_file
        exclude: *runtime_owned
      - id: check-added-large-files
        args: ['--maxkb=1024']
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  # --- JSON and JSONC syntax ---
  #
  # check-json5 parses JSON that is valid JSON5, comments and trailing commas
  # included, so it does not false-fail on .markdownlint-cli2.jsonc. It is the
  # syntax gate only; formatting belongs to the dprint json plugin.
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        # end-of-file-fixer owns final-newline enforcement; do not double-gate.
        args: [-disable-insert-final-newline]
        # Markdown whitespace belongs to dprint, and .editorconfig opts *.md
        # out of trailing-whitespace trimming.
        exclude: '\.md$'

  # --- Formatters and linters that resolve off PATH ---
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no hook in a language that pre-commit builds.
      - id: dprint
        name: dprint fmt
        entry: dprint fmt --allow-no-files
        language: system
        types_or: [markdown, json]
        files: '\.(md|json|jsonc)$'
        exclude: *runtime_owned

      # owner: devshell (outside-caller) `nix fmt` runs the nixfmt that the flake publishes as its formatter, so the hook runs the same one.
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: '\.nix$'
      # owner: devshell (no-hook-language) statix has no hook in a language that pre-commit builds.
      - id: statix
        name: statix check
        entry: statix check
        language: system
        files: '\.nix$'
        pass_filenames: false

      # owner: devshell (no-hook-language) just publishes no hook in a language that pre-commit builds.
      - id: just-fmt
        name: just --fmt --check
        entry: just --unstable --fmt --check
        language: system
        files: '^justfile$'
        pass_filenames: false

      # owner: devshell (no-hook-language) it runs a recipe of this repository.
      - id: pi-config-check
        name: pi-config source proofs
        entry: just check
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # --- Types ---
      #
      # Both read a config file this repository now carries, and a config
      # nothing reads is drift waiting to happen. Neither passes filenames:
      # a type error is a property of the program, not of one file, and
      # checking a subset reports errors that a whole-project run does not.
      # owner: pyproject.toml (outside-caller) the language server of the editor runs pyright-langserver from the same dev group, so the hook runs that pyright through uv.
      - id: pyright
        name: pyright
        entry: uv run --no-sync pyright
        language: system
        files: '\.py$'
        pass_filenames: false
      # owner: package.json (project-environment) tsc checks the extensions against the node_modules and the Pi types of this tree, through npm run.
      - id: tsc
        name: tsc --noEmit
        entry: npm run --silent typecheck
        language: system
        files: '\.ts$'
        pass_filenames: false

      # --- Tests ---
      #
      # This pair is the source of truth for when the suite runs. The cost
      # tag on a test decides which one picks it up, and the budget in the
      # header decides what each stage may cost. `just test` calls these,
      # never the other way round.
      # owner: devshell (no-hook-language) a script of this repository.
      - id: pi-config-test-fast
        name: tests (fast)
        entry: scripts/run-tests.sh fast
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # owner: devshell (no-hook-language) a script of this repository.
      - id: pi-config-test-slow
        name: tests (slow)
        entry: scripts/run-tests.sh slow
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  # --- Shell ---
  #
  # scripts/ and tests/helpers/ are the only shell this tree authors. shfmt
  # takes its indent from .editorconfig, and -d reports instead of rewriting,
  # so the file a later hook reads is the file that was staged. The args
  # replace the --write of the upstream hook, and the manifest names more
  # stages than this tree runs it at.
  #
  # Neither tool sees *.bats. A bats file opens its tests with
  # `@test "name" {`, which is not bash and does not parse. bats itself is the
  # gate for those, through scripts/run-tests.sh.
  #
  # The stub `pi` carries no extension, because it stands in for a command on
  # PATH, so it is matched by path.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [file]
        files: '(\.(sh|bash)$|^tests/helpers/stubs/)'
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-d]
        types: [file]
        stages: [pre-commit]
        files: '(\.(sh|bash)$|^tests/helpers/stubs/)'

  # --- Nix dead code ---
  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      - id: deadnix

  # --- Markdown style gate ---
  #
  # Runs after dprint. The node comes from the devShell through
  # `language_version: system`, so pre-commit does not download one.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']

  # --- Explicit relative links ---
  #
  # A bare-filename relative link like [x](README.md) is ambiguous: the same
  # basename exists in many directories here, so neither a reader nor a tool
  # can tell which file is meant, and the link rots silently when a file
  # moves. Require ./name, ../dir/name, or a multi-segment dir/name.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'

  # --- No language library in a flake ---
  #
  # A Python package goes to pyproject.toml or a PEP 723 block, a Node package
  # to package.json.
  - repo: local
    hooks:
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'

  # --- Python ---
  #
  # The editor runs `ruff server` from the same dev group, so the hooks run
  # that ruff through uv. The file types are the ones of the upstream hooks.
  - repo: local
    hooks:
      # owner: pyproject.toml (outside-caller) the language server of the editor runs ruff server from the dev group, so the hook runs that ruff.
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      # owner: pyproject.toml (outside-caller) the language server of the editor runs ruff server from the dev group, so the hook runs that ruff.
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  # --- Spelling (report only) ---
  #
  # No --write-changes: an automatic rewrite silently edits a deliberate
  # identifier. Fix a real typo by hand, allowlist a false positive in
  # _typos.toml.
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.2
    hooks:
      - id: typos
        args: [--force-exclude]
        stages: [pre-commit]

  # --- Secrets ---
  #
  # This tree sits one directory away from auth.json, so the secret gate is
  # layered: ripsecrets on the staged diff, gitleaks over the whole history
  # before a push.
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-push]

  # --- Link check (network, push time only) ---
  #
  # Arguments stay minimal so lychee.toml owns the behavior. The cache file
  # .lycheecache is gitignored.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # owner: devshell (no-hook-language) lychee publishes no hook in a language that pre-commit builds.
      - id: lychee-system
        stages: [pre-push]
        types: [markdown]
        args: [--no-progress]

  # A flake reference reads the git tree of a checkout, never a path copy of
  # the whole folder into the Nix store. The hook is published by exobrain-tech.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.0.0
    hooks:
      - id: no-path-flake-reference

  # --- Commit message content ---
  #
  # The configured global hook ~/.config/git/hooks/commit-msg-conventional
  # owns the grammar. committed adds the 72-column, lowercase and
  # no-trailing-period rules. Source of truth: committed.toml.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed

  # --- Keep this file honest ---
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
