# The host tools of pi-config's dev environment
# (project-platform:host-requirements-list-the-host-tools). The justfile
# checks nix and git once before any recipe, and prek in the recipes that
# run it, each with the exobrain CLI of the host. exobrain is the checker,
# and the hooks of exobrain-tech and the warnings of .envrc call it.
# prek owns its version through minimum_prek_version in
# .pre-commit-config.yaml. pi itself is the product's own runtime check
# (scripts/pi_config), outside this file.
schema = 1

[tools.git]

[tools.prek]
version = "*"

[tools.nix]

[tools.direnv]

[tools.exobrain]
# The first release that carries `exobrain hooks check`.
version = ">=1.2.0"
